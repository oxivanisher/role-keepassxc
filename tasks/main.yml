---
- name: Determine distribution codename (upstream codename on derivatives like Linux Mint)
  ansible.builtin.include_tasks: detect_codename.yml
  when: keepassxc_install_method in ['auto', 'ppa']

- name: Fetch KeePassXC PPA dists listing
  ansible.builtin.uri:
    url: "{{ keepassxc_ppaurl }}/dists"
    return_content: true
  check_mode: false
  register: keepassxc_ppa_listing
  when: keepassxc_install_method in ['auto', 'ppa']

- name: Parse codename list from HTML
  ansible.builtin.set_fact:
    keepassxc_ppa_codenames: "{{ keepassxc_ppa_listing.content | regex_findall('\\b([a-z]+?)/</a>') | unique }}"
  when: keepassxc_install_method in ['auto', 'ppa']

- name: Select installation method
  ansible.builtin.set_fact:
    keepassxc_selected_method: >-
      {{ keepassxc_install_method if keepassxc_install_method != 'auto'
         else ('ppa' if keepassxc_dist_codename in keepassxc_ppa_codenames
               else keepassxc_fallback_method) }}

- name: Show selected installation method
  ansible.builtin.debug:
    msg: "Installing KeePassXC via {{ keepassxc_selected_method }}"

- name: Install KeePassXC from the PPA
  ansible.builtin.include_tasks: ppa.yml
  when: keepassxc_selected_method == 'ppa'

- name: Install KeePassXC from Flathub
  ansible.builtin.include_tasks: flatpak.yml
  when: keepassxc_selected_method == 'flatpak'

- name: Install KeePassXC from the distribution repositories
  ansible.builtin.apt:
    name: "{{ keepassxc_distro_package }}"
    update_cache: true
    state: present
  become: true
  when: keepassxc_selected_method == 'distro'
